<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
<style>
    body {
        font-family: 'Times New Roman', Times, serif;
        background: whitesmoke;
        margin: 0;
    }
    .container {
        width: 420px;
        margin: 60px auto;
        background: #ffffff;
        border: 1px solid #ccc;
        padding: 30px;
        border-radius: 50px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }
    h2 {
        text-align: center;
        background: #222;
        color: white;
        padding: 12px;
        border-radius: 20px;
    }
    label {
        display: block;
        margin-top: 12px;
        font-weight: bold;
    }
    input, select, textarea {
        font-family: 'Segoe UI', sans-serif;
        font-size: 16px;
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #aaa;
        background: #f9f9f9;
        border-radius: 25px;
    }
    ::placeholder {
        font-size: 14px;
        color: #888;
    }
    .radio-group {
        margin-top: 8px;
    }
    .radio-group input {
        width: auto;
    }
    button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        background: #333;
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 18px;
        cursor: pointer;
    }
    button:hover {
        background-color: #555;
    }
</style>
</head>
<body>
    <div class="container">
    <h2><b>Student Registration</b></h2>
    <form>
        <label for="name">Student Name</label>
        <input type="text" id="name" name="name" placeholder="Enter name" required>
        <label for="rollno">Registration Number</label>
        <input type="text" id="rollno" name="rollno" required>
        <label for="email">Enter Email</label>
        <input type="email" id="email" name="email" required>
        <label for="tel"> Phone Number</label>
        <input type="tel" id="tel" name="tel" pattern="\+92-[0-9]{3}-[0-9]{7}">
        <label for="dob">Date of birth</label>
        <input type="date" id="dob" name="dob" required>
        <label for="program">Program</label>
        <select name="program" id="program" required>
            <option value="BSCS">BS-CS</option>
            <option value="BSIT">BS-IT</option>
            <option value="BSAF">BS-AF</option>
            <option value="BBA">BBA</option>
        </select>
        <label for="addr"> Address</label>
        <textarea id="addr" name="addr" rows="3" required></textarea>
        <label>Student Type</label>
        <div class="radio-group">
             <input type="radio" name="type" value="full" required> Full-Time
            <input type="radio" name="type" value="part"> Part-Time
        </div>
        <button type="submit">Submit</button>


    </form>
    </div>
</body>
</html>
